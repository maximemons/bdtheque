<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Collections - BDthèque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../styles/common.css">
    <link rel="stylesheet" href="../bds/styles/bds.css">
    <link rel="stylesheet" href="styles/collections.css">
</head>
<body>
    <!-- Header mobile (hamburger menu) -->
    <header class="header-mobile">
        <i class="fas fa-bars hamburger" id="hamburger"></i>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar (générée dynamiquement par menu.js) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="shortcut-card shortcut-card-full">
                <h2 class="shortcut-search">Rechercher</h2>
                <div class="shortcut-search">
                    <input id="searchBarInput" type="text" placeholder="nom de la collection">
                    <button id="searchBar">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <h2 style="margin-top:15px; border-top: 1px groove;" class="shortcut-search">Ajouter une collection</h2>
                <div class="shortcut-search">
                    <button id="openAddCollectionForm">+</button>
                </div>
                <h2 style="margin-top:15px;" class="shortcut-show">Retour à la liste</h2>
                <div class="shortcut-show">
                    <button id="backToListBtn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                </div>
            </div>
            <main class="bd-list" id="collectionsList"></main>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="addCollection">
            <form id="collection-form">
              <h2 id="formTitle">Ajouter une collection</h2>
              <label for="collectionName">Nom *</label>
              <input type="text" id="collectionName" name="collectionName" required placeholder="Naruto, Astérix...">

              <label for="collectionSpecial">Édition spéciale ?</label>
              <input type="text" id="collectionSpecial" name="collectionSpecial" placeholder="HS, BEST-OF...">

              <div>
                  <button class="formAction" type="submit">Créer</button>
                  <button class="formAction" id="cancelAddCollection" type="button">Annuler</button>
              </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../scripts/menu.js"></script>
    <script type="module" src="scripts/collections.js"></script>
</body>
</html>
