<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Éditeurs - BDthèque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../styles/common.css">
    <link rel="stylesheet" href="../bds/styles/bds.css">
    <link rel="stylesheet" href="../collections/styles/collections.css">
    <link rel="stylesheet" href="styles/editeurs.css">
</head>
<body>
    <!-- Header mobile (hamburger menu) -->
    <header class="header-mobile">
        <i class="fas fa-bars hamburger" id="hamburger"></i>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar (générée dynamiquement par menu.js) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="shortcut-card shortcut-card-full">
                <h2 class="shortcut-search">Rechercher</h2>
                <div class="shortcut-search">
                    <input id="searchBarInput" type="text" placeholder="nom de l'éditeur">
                    <button id="searchBar">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <h2 style="margin-top:15px; border-top: 1px groove;" class="shortcut-search">Ajouter un éditeur</h2>
                <div class="shortcut-search">
                    <button id="openAddEditeurForm">+</button>
                </div>
                <h2 style="margin-top:15px;" class="shortcut-show">Retour à la liste</h2>
                <div class="shortcut-show">
                    <button id="backToListBtn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                </div>
            </div>
            <main class="bd-list" id="editeursList"></main>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="addEditeur">
            <form id="editeur-form">
              <h2 id="formTitle">Ajouter un éditeur</h2>
              <label for="editeurName">Nom *</label>
              <input type="text" id="editeurName" name="editeurName" required placeholder="Glénat, Dargaud...">

              <div>
                  <button class="formAction" type="submit">Créer</button>
                  <button class="formAction" id="cancelAddEditeur" type="button">Annuler</button>
              </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../scripts/menu.js"></script>
    <script type="module" src="scripts/editeurs.js"></script>
</body>
</html>
