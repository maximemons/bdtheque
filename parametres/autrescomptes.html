<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autres comptes - BDthèque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="styles/moncompte.css">
    <link rel="stylesheet" href="styles/autrescomptes.css">
</head>
<body>
    <!-- Header mobile (hamburger menu) -->
    <header class="header-mobile">
        <i class="fas fa-bars hamburger" id="hamburger"></i>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar (générée dynamiquement par menu.js) -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <h3>Comptes partagés</h3>
            <p class="hint">Donnez accès à votre BDthèque à d'autres comptes. Les comptes en lecture peuvent consulter votre collection ; les comptes en écriture peuvent aussi l'éditer.</p>

            <form id="addAccountForm" class="add-account-form">
                <input type="email" id="newAccountEmail" placeholder="Adresse email du compte à inviter" required>
                <label class="checkbox-inline">
                    <input type="checkbox" id="newAccountCanWrite">
                    Autoriser l'écriture
                </label>
                <button type="submit"><i class="fas fa-user-plus"></i> Inviter</button>
            </form>

            <div id="error" class="error"></div>

            <ul id="accountsList" class="accounts-list"></ul>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h4 style="padding-bottom: 15px" id="modalText"></h4>
            <button id="modalValidate">J'ai compris !</button>
        </div>
    </div>

    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="scripts/autrescomptes.js"></script>
</body>
</html>
